global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: simurgh-lab-host
    static_configs:
      - targets: [node-exporter:9100]
        labels:
          telemetry_host: simurgh-lab-host
