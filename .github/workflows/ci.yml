name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Start local Grafana lab
        run: docker compose -f infra/compose.yaml up -d --wait --wait-timeout 180
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify browser integration
        run: npm run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase1-browser-evidence
          path: tests/browser/artifacts/
          if-no-files-found: ignore
      - name: Stop local Grafana lab
        if: always()
        run: docker compose -f infra/compose.yaml down --remove-orphans
